[project]
name = "ai-cost-hack"
version = "0.1.0"
description = "Public starter and benchmark contract for the London AI Cost Hack"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["openai>=2.0"]

[project.scripts]
costhack = "costhack.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/costhack", "examples"]

[dependency-groups]
dev = ["mypy>=1.13", "pytest>=8.3", "ruff>=0.7"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "submission", "examples", "tests"]
pretty = true
show_error_codes = true
warn_unreachable = true
