[project]
name = "ai-cost-hack"
version = "0.1.0"
description = "Public starter and benchmark contract for the London AI Cost Hack"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
costhack = "costhack.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/costhack"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.7"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

